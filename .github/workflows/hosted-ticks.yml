# Unattended hosted autonomy faster than Vercel Hobby's daily cron.
# Prefer an authenticated GET /api/jobs/run (same path Vercel Cron uses).
#
# Required for authenticated ticks (copy from Vercel Production):
#   CRON_SECRET or AGENT_WORLD_CRON_SECRET
# Optional:
#   AGENT_WORLD_PRODUCTION_URL  (defaults to https://agent-world-lovat.vercel.app)
#
# If those secrets are unset, this workflow still polls GET /api/state so due
# ticks are scheduled and drained the same way a spectator browser would.

name: Hosted autonomy ticks

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    if: github.repository == 'narulaskaran/agent-world'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run hosted jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AGENT_WORLD_CRON_SECRET: ${{ secrets.AGENT_WORLD_CRON_SECRET }}
          AGENT_WORLD_PRODUCTION_URL: ${{ secrets.AGENT_WORLD_PRODUCTION_URL }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          base = (os.environ.get("AGENT_WORLD_PRODUCTION_URL") or "https://agent-world-lovat.vercel.app").rstrip("/")
          secret = os.environ.get("CRON_SECRET") or os.environ.get("AGENT_WORLD_CRON_SECRET") or ""
          if secret:
              path = "/api/jobs/run?limit=20"
              print("Authenticated GET /api/jobs/run")
          else:
              path = "/api/state"
              print(
                  "::notice::CRON_SECRET / AGENT_WORLD_CRON_SECRET unset; "
                  "falling back to spectator GET /api/state. Copy production "
                  "CRON_SECRET from Vercel into GitHub Actions secrets for full "
                  "/api/jobs/run maintenance."
              )

          url = base + path
          headers = {"User-Agent": "agent-world-hosted-ticks"}
          if secret:
              headers["Authorization"] = f"Bearer {secret}"
          request = urllib.request.Request(url, method="GET", headers=headers)
          try:
              with urllib.request.urlopen(request, timeout=55) as response:
                  status = response.status
                  raw = response.read().decode()
          except urllib.error.HTTPError as error:
              status = error.code
              raw = error.read().decode()
          print(f"HTTP {status} GET {path}")
          try:
              body = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:500])
              sys.exit(1 if status != 200 else 0)
          snap = body.get("snapshot") if isinstance(body.get("snapshot"), dict) else body
          shown = {key: body[key] for key in ("processed", "pendingDue", "recovered", "error", "ok") if key in body}
          if isinstance(snap, dict):
              shown["connectedViewers"] = snap.get("connectedViewers")
              shown["characters"] = len(snap.get("characters") or [])
              shown["generatedAt"] = snap.get("generatedAt")
          print(json.dumps(shown, sort_keys=True))
          sys.exit(0 if status == 200 else 1)
          PY
